# nginx proxy address - http://172.17.0.1:59057

name: kestra
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: kestra/kestra:latest
    container_name: kestra-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    user: 'root'
    command: server standalone
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-db:5432/${DB_CREATE_DATABASE_NAME:-kestra}
            driverClassName: org.postgresql.Driver
            username: ${DB_USER_NAME:-kestra}
            password: ${DB_USER_PASS:-changeme_db_password}
        kestra:
          server:
            basic-auth:
              enabled: true
              username: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-${BASE_HOST_NAME}}
              password: ${APP_ADMIN_PASS:-changeme_admin_password}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: https://${BASE_HOST_NAME:-localhost}/
      CONTAINER_NAME: kestra-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:59057:8080'
    volumes:
      - './volumes/data/tmp:/tmp/kestra-wd'
      - './volumes/data/kestra:/app/storage'
      - '/var/run/docker.sock:/var/run/docker.sock'
    depends_on:
      db:
        condition: service_started
    networks:
      - kestra
      - proxy
      - cloudflare
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://kestra-app:8080'
      - 'cloudflare.hostname=kestra.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.kestra-app.entrypoints=http'
      - 'traefik.http.routers.kestra-app-secure.tls=true'
      - 'traefik.http.routers.kestra-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.kestra-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.kestra-app.middlewares=kestra-app-https-redirect'
      - 'traefik.http.routers.kestra-app-secure.entrypoints=https'
      - 'traefik.http.routers.kestra-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.kestra-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.kestra-app-secure.service=kestra-app'
      - 'traefik.http.services.kestra-app.loadbalancer.server.port=8080'

  db:
    image: postgres:latest
    container_name: kestra-db
    hostname: kestra-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-kestra}
      POSTGRES_USER: ${DB_USER_NAME:-kestra}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: kestra-db
    expose:
      - 5432
    volumes:
      - './volumes/data/db/postgres/kestra:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - kestra

networks:
  kestra:
    name: kestra
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
